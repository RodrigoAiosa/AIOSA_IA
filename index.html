<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alosa — Assistente do Rodrigo Aiosa</title>
  <meta name="description" content="Converse com o Alosa, assistente do Rodrigo Aiosa: Power BI, Python, SQL, Excel/VBA, treinamentos e mentorias.">
  <meta name="theme-color" content="#008069" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#202C33" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Alosa — Assistente do Rodrigo Aiosa">
  <meta property="og:description" content="Tire dúvidas sobre dados, Power BI, Python e SQL e conheça os treinamentos do Rodrigo Aiosa.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E">

  <style>
    /* Cores do WhatsApp (Android/Web). Claro e escuro seguem o tema do aparelho. */
    :root {
      --header: #008069;        --header-texto: #FFFFFF;  --header-status: #D9FDD3;
      --fundo: #EFEAE2;         --texto: #111B21;         --hora: #667781;
      --bolha-user: #D9FDD3;    --bolha-bot: #FFFFFF;
      --campo: #FFFFFF;         --campo-texto: #111B21;   --placeholder: #667781;
      --enviar: #00A884;        --link: #027EB5;          --online: #25D366;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --header: #202C33;      --header-texto: #E9EDEF;  --header-status: #8696A0;
        --fundo: #0B141A;       --texto: #E9EDEF;         --hora: #8696A0;
        --bolha-user: #005C4B;  --bolha-bot: #202C33;
        --campo: #2A3942;       --campo-texto: #E9EDEF;   --placeholder: #8696A0;
        --enviar: #00A884;      --link: #53BDEB;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--fundo); color: var(--texto);
      font-family: "Segoe UI", Helvetica Neue, Helvetica, Arial, sans-serif; }

    /* Tela inteira: sem moldura nem largura máxima. */
    #app { display: flex; flex-direction: column; width: 100vw; height: 100vh; height: 100dvh; }

    header { flex: none; background: var(--header); color: var(--header-texto); display: flex; align-items: center;
      gap: 14px; padding: 10px 16px; min-height: 59px; padding-top: calc(10px + env(safe-area-inset-top)); z-index: 2; }
    .foto { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #aaa; flex: none; }
    .nome { font-weight: 500; font-size: 16px; margin: 0; line-height: 1.25; }
    .status { font-size: 13px; margin: 0; color: var(--header-status); line-height: 1.25; }

    #chat { flex: 1; overflow-y: auto; padding: 12px clamp(8px, 6vw, 80px); display: flex; flex-direction: column; gap: 4px;
      overscroll-behavior: contain; background: var(--fundo); }
    .bolha { position: relative; padding: 6px 7px 6px 9px; max-width: min(75%, 640px); font-size: 14.2px; line-height: 19px;
      color: var(--texto); overflow-wrap: anywhere; box-shadow: 0 1px .5px rgba(11,20,26,.13); border-radius: 7.5px; }
    .bolha .txt { display: inline; }
    .bolha .hora { float: right; margin: 7px 0 -3px 10px; font-size: 11px; line-height: 15px; color: var(--hora); }
    .user { background: var(--bolha-user); align-self: flex-end; border-top-right-radius: 0; margin-top: 4px; }
    .bot  { background: var(--bolha-bot);  align-self: flex-start; border-top-left-radius: 0; margin-top: 4px; }
    .user::after, .bot::after { content: ""; position: absolute; top: 0; width: 8px; height: 13px; }
    .user::after { right: -8px; background: var(--bolha-user); clip-path: polygon(0 0, 100% 0, 0 100%); }
    .bot::after  { left: -8px;  background: var(--bolha-bot);  clip-path: polygon(0 0, 100% 0, 100% 100%); }
    .bolha a { color: var(--link); text-decoration: none; }
    .bolha a:hover { text-decoration: underline; }
    @media (max-width: 600px) { .bolha { max-width: 85%; } }

    .digitando { display: inline-flex; gap: 4px; padding: 6px 2px; }
    .digitando i { width: 7px; height: 7px; border-radius: 50%; background: var(--hora); animation: pulo 1.2s infinite ease-in-out; }
    .digitando i:nth-child(2) { animation-delay: .15s; }
    .digitando i:nth-child(3) { animation-delay: .3s; }
    @keyframes pulo { 0%, 80%, 100% { opacity: .35; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
    @media (prefers-reduced-motion: reduce) { .digitando i { animation: none; opacity: .6; } }

    form { flex: none; background: var(--fundo); padding: 6px clamp(8px, 6vw, 80px) calc(8px + env(safe-area-inset-bottom)); }
    .campo { display: flex; align-items: flex-end; gap: 8px; }
    textarea { flex: 1; resize: none; border: 0; outline: 0; border-radius: 22px; padding: 11px 16px; font: inherit;
      font-size: 15px; line-height: 20px; max-height: 140px; background: var(--campo); color: var(--campo-texto);
      caret-color: var(--enviar); box-shadow: 0 1px .5px rgba(11,20,26,.13); }
    textarea::placeholder { color: var(--placeholder); }
    button { flex: none; width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--enviar); color: #fff;
      cursor: pointer; display: grid; place-items: center; }
    button svg { width: 22px; height: 22px; fill: currentColor; }
    button:hover:not(:disabled) { filter: brightness(1.08); }
    button:disabled { opacity: .55; cursor: default; }
    button:focus-visible { outline: 2px solid var(--enviar); outline-offset: 2px; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <img class="foto" src="eu_ia_foto.jpg" alt="Rodrigo Aiosa" width="40" height="40">
      <div>
        <p class="nome">Alosa — Assistente do Rodrigo Aiosa</p>
        <p class="status">online</p>
      </div>
    </header>

    <main id="chat" role="log" aria-live="polite" aria-label="Conversa com o Alosa"></main>

    <form id="form" autocomplete="off">
      <div class="campo">
        <textarea id="entrada" rows="1" maxlength="1500" placeholder="Digite uma mensagem"
          aria-label="Sua mensagem" autofocus></textarea>
        <button id="enviar" type="submit" aria-label="Enviar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1.1 21.8 23 12 1.1 2.2 1 9.8l15.7 2.2L1 14.2z"/></svg></button>
      </div>
    </form>
  </div>

  <noscript><p style="padding:24px;text-align:center">Ative o JavaScript para conversar com o Alosa.</p></noscript>

  <script>
    (function () {
      var MAX_HISTORICO = 12;
      var chat = document.getElementById("chat");
      var form = document.getElementById("form");
      var entrada = document.getElementById("entrada");
      var enviar = document.getElementById("enviar");
      var mensagens = [];
      var ocupado = false;

      // Escapa HTML SEMPRE antes de aplicar o markdown (usuário e modelo) — evita XSS.
      function escapar(t) {
        return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;").replace(/'/g, "&#x27;");
      }
      function markdownParaHtml(t) {
        t = escapar(t);
        t = t.replace(/\[([^\]]+)\]\(((?:https?:\/\/|mailto:)[^)]+)\)/g,
          '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
        t = t.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
        t = t.replace(/\*(.+?)\*/g, "<em>$1</em>");
        return t.replace(/\n/g, "<br>");
      }

      function hora() {
        var d = new Date();
        return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
      }
      function rolar() { chat.scrollTop = chat.scrollHeight; }
      function bolha(tipo, html) {
        var d = document.createElement("div");
        d.className = "bolha " + tipo;
        d.innerHTML = '<span class="txt">' + html + '</span><span class="hora">' + hora() + '</span>';
        chat.appendChild(d);
        rolar();
        return d;
      }

      function ajustarAltura() {
        entrada.style.height = "auto";
        entrada.style.height = Math.min(entrada.scrollHeight, 140) + "px";
      }

      function definirOcupado(v) {
        ocupado = v;
        enviar.disabled = v;
      }

      async function enviarMensagem() {
        var texto = entrada.value.trim();
        if (!texto || ocupado) return;
        entrada.value = "";
        ajustarAltura();
        mensagens.push({ role: "user", content: texto });
        bolha("user", markdownParaHtml(texto));
        definirOcupado(true);
        var espera = bolha("bot", '<span class="digitando" aria-label="Alosa está digitando"><i></i><i></i><i></i></span>');

        var resposta;
        try {
          var r = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages: mensagens.slice(-MAX_HISTORICO) })
          });
          var dados = await r.json();
          resposta = (r.ok && dados.resposta) ? dados.resposta :
            "Tive um probleminha técnico agora. Pode tentar de novo em instantes? Se persistir, fala direto com o Rodrigo: [📲 WhatsApp](https://wa.me/5511977019335?text=Ol%C3%A1+Rodrigo!+Tive+um+problema+no+chat+do+site.)";
        } catch (e) {
          resposta = "Sem conexão no momento. Verifique sua internet e tente de novo.";
        }

        mensagens.push({ role: "assistant", content: resposta });
        espera.querySelector(".txt").innerHTML = markdownParaHtml(resposta);
        rolar();
        definirOcupado(false);
        entrada.focus();
      }

      form.addEventListener("submit", function (e) { e.preventDefault(); enviarMensagem(); });
      entrada.addEventListener("input", ajustarAltura);
      entrada.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); enviarMensagem(); }
      });
    })();
  </script>
</body>
</html>
