<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alosa — Assistente do Rodrigo Aiosa</title>
  <meta name="description" content="Converse com o Alosa, assistente do Rodrigo Aiosa: Power BI, Python, SQL, Excel/VBA, treinamentos e mentorias.">
  <meta name="theme-color" content="#075E54">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Alosa — Assistente do Rodrigo Aiosa">
  <meta property="og:description" content="Tire dúvidas sobre dados, Power BI, Python e SQL e conheça os treinamentos do Rodrigo Aiosa.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E">

  <style>
    :root { --verde: #075E54; --bg: #ECE5DD; --user: #DCF8C6; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 900px; margin: 0 auto; }

    header { flex: none; background: var(--verde); color: #fff; display: flex; align-items: center;
      gap: 12px; padding: 8px 16px; min-height: 60px; box-shadow: 0 2px 5px rgba(0,0,0,.3); z-index: 2; }
    .foto { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: #aaa; flex: none; }
    .nome { font-weight: 700; font-size: 15px; margin: 0; line-height: 1.3; }
    .status { font-size: 12px; margin: 0; color: #a8d5a2; display: flex; align-items: center; gap: 5px; }
    .ponto { width: 8px; height: 8px; border-radius: 50%; background: #25D366; }

    #chat { flex: 1; overflow-y: auto; padding: 14px 8px; display: flex; flex-direction: column; gap: 6px;
      overscroll-behavior: contain; }
    .bolha { padding: 8px 12px; max-width: 78%; font-size: 14px; line-height: 1.5; word-wrap: break-word;
      overflow-wrap: anywhere; box-shadow: 0 1px 1px rgba(0,0,0,.1); }
    .user { background: var(--user); align-self: flex-end; margin-right: 6px; border-radius: 8px 0 8px 8px; }
    .bot { background: #fff; align-self: flex-start; margin-left: 6px; border-radius: 0 8px 8px 8px; }
    .bolha a { color: var(--verde); font-weight: 700; text-decoration: underline; }
    @media (max-width: 600px) { .bolha { max-width: 88%; } }

    .digitando { display: inline-flex; gap: 4px; padding: 4px 2px; }
    .digitando i { width: 7px; height: 7px; border-radius: 50%; background: #999; animation: pulo 1.2s infinite ease-in-out; }
    .digitando i:nth-child(2) { animation-delay: .15s; }
    .digitando i:nth-child(3) { animation-delay: .3s; }
    @keyframes pulo { 0%, 80%, 100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
    @media (prefers-reduced-motion: reduce) { .digitando i { animation: none; opacity: .6; } }

    form { flex: none; background: #0e1117; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
    .campo { display: flex; align-items: flex-end; gap: 8px; background: #262730; border-radius: 12px; padding: 8px; }
    textarea { flex: 1; resize: none; border: 0; outline: 0; border-radius: 8px; padding: 9px 10px; font: inherit;
      font-size: 15px; line-height: 1.4; max-height: 140px; background: #fff; color: #000; caret-color: #000; }
    textarea::placeholder { color: #777; }
    button { flex: none; width: 40px; height: 40px; border: 0; border-radius: 8px; background: #3a3b45; color: #fff;
      font-size: 18px; cursor: pointer; }
    button:hover:not(:disabled) { background: var(--verde); }
    button:disabled { opacity: .5; cursor: default; }
    button:focus-visible, textarea:focus-visible { outline: 2px solid #25D366; outline-offset: 2px; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <img class="foto" src="eu_ia_foto.jpg" alt="Rodrigo Aiosa" width="42" height="42">
      <div>
        <p class="nome">Alosa — Assistente do Rodrigo Aiosa</p>
        <p class="status"><span class="ponto"></span>online</p>
      </div>
    </header>

    <main id="chat" role="log" aria-live="polite" aria-label="Conversa com o Alosa"></main>

    <form id="form" autocomplete="off">
      <div class="campo">
        <textarea id="entrada" rows="1" maxlength="1500" placeholder="Como posso ajudar em seu projeto de dados?"
          aria-label="Sua mensagem" autofocus></textarea>
        <button id="enviar" type="submit" aria-label="Enviar">➤</button>
      </div>
    </form>
  </div>

  <noscript><p style="padding:24px;text-align:center">Ative o JavaScript para conversar com o Alosa.</p></noscript>

  <script>
    (function () {
      var MAX_HISTORICO = 12;
      var chat = document.getElementById("chat");
      var form = document.getElementById("form");
      var entrada = document.getElementById("entrada");
      var enviar = document.getElementById("enviar");
      var mensagens = [];
      var ocupado = false;

      // Escapa HTML SEMPRE antes de aplicar o markdown (usuário e modelo) — evita XSS.
      function escapar(t) {
        return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;").replace(/'/g, "&#x27;");
      }
      function markdownParaHtml(t) {
        t = escapar(t);
        t = t.replace(/\[([^\]]+)\]\(((?:https?:\/\/|mailto:)[^)]+)\)/g,
          '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
        t = t.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
        t = t.replace(/\*(.+?)\*/g, "<em>$1</em>");
        return t.replace(/\n/g, "<br>");
      }

      function rolar() { chat.scrollTop = chat.scrollHeight; }
      function bolha(tipo, html) {
        var d = document.createElement("div");
        d.className = "bolha " + tipo;
        d.innerHTML = html;
        chat.appendChild(d);
        rolar();
        return d;
      }

      function ajustarAltura() {
        entrada.style.height = "auto";
        entrada.style.height = Math.min(entrada.scrollHeight, 140) + "px";
      }

      function definirOcupado(v) {
        ocupado = v;
        enviar.disabled = v;
      }

      async function enviarMensagem() {
        var texto = entrada.value.trim();
        if (!texto || ocupado) return;
        entrada.value = "";
        ajustarAltura();
        mensagens.push({ role: "user", content: texto });
        bolha("user", markdownParaHtml(texto));
        definirOcupado(true);
        var espera = bolha("bot", '<span class="digitando" aria-label="Alosa está digitando"><i></i><i></i><i></i></span>');

        var resposta;
        try {
          var r = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages: mensagens.slice(-MAX_HISTORICO) })
          });
          var dados = await r.json();
          resposta = (r.ok && dados.resposta) ? dados.resposta :
            "Tive um probleminha técnico agora. Pode tentar de novo em instantes? Se persistir, fala direto com o Rodrigo: [📲 WhatsApp](https://wa.me/5511977019335?text=Ol%C3%A1+Rodrigo!+Tive+um+problema+no+chat+do+site.)";
        } catch (e) {
          resposta = "Sem conexão no momento. Verifique sua internet e tente de novo.";
        }

        mensagens.push({ role: "assistant", content: resposta });
        espera.innerHTML = markdownParaHtml(resposta);
        rolar();
        definirOcupado(false);
        entrada.focus();
      }

      form.addEventListener("submit", function (e) { e.preventDefault(); enviarMensagem(); });
      entrada.addEventListener("input", ajustarAltura);
      entrada.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); enviarMensagem(); }
      });
    })();
  </script>
</body>
</html>
