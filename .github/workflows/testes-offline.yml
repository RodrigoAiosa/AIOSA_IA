name: Testes offline (sem chave)

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regras de segurança (Python)
        run: python3 tests/test_seguranca.py
      - name: Paridade Python x JavaScript
        run: python3 tests/comparar_seguranca.py
      - name: Servidor com Gemini simulado
        run: node tests/unitarios.js
